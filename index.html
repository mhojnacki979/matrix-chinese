<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>汉字雨 · Hanzi Rain</title>
<meta name="description" content="Chinese characters falling down the screen — a full-screen digital rain rendered on canvas." />
<meta name="robots" content="noindex" />
<style>
  :root {
    --void: #03060d;
    --void-soft: #0a1730;
    --rain: #1b4488;
    --rain-dim: #c3223f;
    --head: #eef4ff;
    --hud: #7fa8e6;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--void);
    overflow: hidden;
  }

  body {
    color: var(--rain);
    font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
    -webkit-font-smoothing: antialiased;
  }

  canvas#rain {
    display: block;
    width: 100%;
    height: 100%;
    background: var(--void);
  }

  /* Vignette + phosphor scanlines: the screen this rain is supposed to be falling on. */
  .crt {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.17) 3px,
        rgba(0, 0, 0, 0.17) 4px
      ),
      radial-gradient(120% 90% at 50% 45%, rgba(0, 0, 0, 0) 42%, rgba(0, 0, 0, 0.72) 100%);
  }

  .hint {
    position: fixed;
    left: max(1.25rem, env(safe-area-inset-left));
    bottom: max(1.25rem, env(safe-area-inset-bottom));
    display: flex;
    flex-wrap: wrap;
    gap: 0.35rem 1.1rem;
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 0.6875rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--hud);
    text-shadow: 0 0 10px rgba(90, 150, 255, 0.45);
    opacity: 0.72;
    transition: opacity 900ms ease;
  }

  .hint[data-idle="true"] { opacity: 0; }

  .hint kbd {
    font: inherit;
    color: var(--head);
    border: 1px solid rgba(127, 168, 230, 0.4);
    border-radius: 2px;
    padding: 0.1em 0.4em;
    margin-right: 0.4em;
  }

  .state {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: clamp(1.5rem, 6vw, 3rem);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    color: var(--head);
    text-shadow: 0 0 24px rgba(90, 150, 255, 0.8);
    opacity: 0;
    transition: opacity 250ms ease;
  }

  .state[data-visible="true"] { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .hint, .state { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="rain" aria-label="Chinese characters falling down the screen" role="img"></canvas>
  <div class="crt"></div>
  <div class="state" id="state" aria-hidden="true">暂停</div>
  <ul class="hint" id="hint">
    <li><kbd>Space</kbd>Pause</li>
    <li><kbd>↑ ↓</kbd>Speed</li>
    <li><kbd>R</kbd>Reseed</li>
  </ul>

<script>
(function () {
  'use strict';

  // Common hanzi — frequent enough to look like language rather than noise.
  var GLYPHS =
    '的一是不了人我在有他这为之大来以个中上们到说国和地也子时道出而要于就下得可你年生' +
    '自会那后能对着事其里所去行过家十用发天如然作方成者多日都三小军二无同么经法当起与好' +
    '看学进种将还分此心前面又定见只主没公从水风雨雷电山川木火土金石光影空色声字数机电脑' +
    '网信息真假虚实梦醒生死始终门开关内外东西南北左右高低快慢新旧黑白红青蓝紫银铁龙凤鹤' +
    '雪云雾霜露星月阳阴春夏秋冬江河海湖林森竹松花草鸟鱼虫兽神仙魔灵魂命运缘劫';

  var canvas = document.getElementById('rain');
  var ctx = canvas.getContext('2d', { alpha: false });
  var hint = document.getElementById('hint');
  var stateLabel = document.getElementById('state');

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var CELL = 0;           // glyph cell size in CSS pixels
  var cols = 0;
  var rows = 0;
  var streams = [];       // several falling streams share each column
  var STREAMS_PER_COL = 3;
  var logoCells = null;   // per-cell logo color, or null outside the wordmark
  var logoLit = null;     // indices of the cells the mark covers
  var logoHalo = null;    // a ring of cells kept clear, so the mark has an edge
  var LOGO_NAVY = '#8ab3f7';
  var LOGO_RED = '#ff6f89';
  var LOGO_WHITE = '#ffffff';
  var dpr = 1;
  var speedScale = 1;
  var paused = false;

  function glyph() {
    return GLYPHS.charAt((Math.random() * GLYPHS.length) | 0);
  }

  function seedStream(x, spawnAbove) {
    return {
      x: x,
      // Rows are fractional so streams fall at their own pace, not the frame rate's.
      // Spawning well above the top staggers the streams sharing this column.
      row: spawnAbove ? -Math.random() * rows * 1.5 : Math.random() * rows,
      last: -1,
      speed: 2 + Math.random() * 5.3,     // cells per second
      gap: Math.random() < 0.05           // a few streams sit out, so it isn't a solid wall
    };
  }

  // The Ringer mark, reduced to three flat brand colors on transparency. It is never
  // drawn to the screen — it is sampled at one pixel per character cell, and the
  // rain paints itself in those colors as it falls through the shape.
  var LOGO_MASK = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAOcAAAGkCAYAAADKTzJWAAAJpklEQVR42u3dMVIjSRCFYalCR8CGGxD4nANXPifCX5dz4G9wA7D3DlprI3ZZgWh1V3dW5vebE8wMqsq/36tWI3Y7AAAAAAAAAMD27Cu/+JuH4+ncn//15x97o2EvyBloEAyGvYhEMwzLfC3sBTlXGgaC2gtyAqgt55yrrvS0F+QEMUFOQwVyJhKLoPaBnADI6apt3aKyNxTX4wki69+Tg/GZP3gklZTkHGQQK8pKRrV22IHJJKx1lZwlLhSRh0saSk6DtVJSWBPJCRcdLID3OQFyShfYb8kJkBMAOVVaFNt3yQmQ09UT9r+knMREtjlQawFyulrCPJSSk5jIOhfNBoCg5ARQQU6piexz0iw4CEpOYsLcTGBvcVGJkT41YU9MkFStJSbMVYbkJCWqp2gjJqRozHnbWyAgZoruiQnElLQRE4g5l42YQMz59OA7EJTN5JSakJ6SE5CcAMgJkBMAOQGQE/gdWz4p1Cq+aEByAiAnQE4A5ATICYCcAMgJkBMAOQFyAiAnAHLm5uPtZffx9mIhyDkPnyHUV1KMP6eSk5CQnADICUlKThAR5ATIuQ4+pkSijkDJzxACARFYTukJqRlUTg8iSFYElJOYxIvOzcPxVO4JIWJiNEm3+H/3pKyRnHePzxZssHNoI6ZKi5hz3IgJxJznPSnrJKdqO1bNbcRUaRFzzhsxgZjz3ogpcRFz7hsxCYaY838gJbC8oEvcKGrElLyImaKNmMRCTEEbMYGYgjZiAjEF9UkIBSutejwGba2rACA9O8pJTGA9QRsxa1Va1XYcQRsxgZiCuiEEBKUtZTnGqbSq7RjpKTmBEZNTakpmbJeeB0tkUKO9bh+notYS016MKadKC2xbbSWnKmUvguLMeWYo1CpSOnMaElhzcl4zLAaGmOQ0OC6AICdBrSk5XeVBTHIaLBc4coKg1mw1fvxUak8JXcZ7oqScw0+fDC85DZ+1UWsNoTXBYrVWtVVzSblNpZWchtNrV2vrDWm1QSXmBrVWtVVzSbl+pZWchtdrk5zIlqLE7Juav5aToAQl5fpyqrWGm5gj11rpWTtFSbl+akpOIDDkBDLIOSWSAczzR3ICai3+zUhvqfiZ1UHkVG2B/pVWcgJqLUaviartIHKqtkB/XyQnoNZi9Hqo2g4ip2oL9PVEcgJqLTLUQtV2EDlVW6CfH5ITCMrs5PMD2DHq4NcfiF77/8PyrbJF+CawvCh+3V7xMye2l/KSgAQtLqf0XL/STpGuh6Du2vb34WApx6+wU/4eqdRaBBJTzR2Txeqou7Z961/Uakr2fke8FvGbwn+Hv5cAxFJrEVgeghaotertctVxK2GurbkE79MeJScxSabWYgQ5CJq41qq205MzqhBTkr+61D1uiEpOYhJOrcWIw+8B+mRyes8z38Bf+n4rPxbYa94l58qV1m+2BjkNt9Qnp2pbcaAJ2n/OJach9tqC0jXdvN8JyRk0OVVbEFOtBdJBTqCqnKotVFrJCUhOAEnkVG2h0kpOQHICSCKnaguVVnICkhNAEjlVW6i0khOQnIDUTCKnagtIToCc0hMqreQEJCeAonKqtlBpJScgOQEkkVO1hUorOQHJCSCJnKotVFrJCUhOAEnkVG2h0kpOQHJKT0ByAilDgpyA5FRtITUlJyA5AZSRU7WFuZOcgOQEMJ2wFfLm4Xg69+evn+92bbfbPd3eT/r6j7eX8mt29/g81FGqZR9K4Ccx1VoAeeR01xbV52zI5FRtkb3SqrUAOVVbmK8yyanaInOlVWsBcqq2MFelklO1RdZKq9YC5FRtYZ7KJadqi4yVVq0FyKnawhyVTE7VFtkqrVoLkLN/JZGeuJSaox2NJCdATgCp5VRtUaHSSk6AnABKyKnaInullZwAOQGUkVO1ReZKKzkBcgKx2hU   var logoImg = new Image();
  var logoReady = false;
  logoImg.onload = function () { logoReady = true; buildLogoMask(); if (reduceMotion) still(); };
  logoImg.src = LOGO_MASK;

  function buildLogoMask() {
    logoCells = null;
    logoLit = null;
    logoHalo = null;
    if (!logoReady || !cols || !rows) return;

    // One pixel per cell: each character gets the average color under it.
    var off = document.createElement('canvas');
    off.width = cols;
    off.height = rows;
    var octx = off.getContext('2d');

    var scale = Math.min((rows * 0.82) / logoImg.height, (cols * 0.5) / logoImg.width);
    var w = logoImg.width * scale;
    var h = logoImg.height * scale;
    octx.drawImage(logoImg, (cols - w) / 2, (rows - h) / 2, w, h);

    var data = octx.getImageData(0, 0, cols, rows).data;
    var cells = new Array(cols * rows);
    var lit = [];
    for (var i = 0; i < cols * rows; i++) {
      var a = data[i * 4 + 3];
      if (a < 110) { cells[i] = null; continue; }
      // Snap to the nearest brand color rather than averaging: downscaling blends
      // navy into red at the edges, and a muddy middle reads as noise, not a logo.
      var r = data[i * 4], g = data[i * 4 + 1], b = data[i * 4 + 2];
      cells[i] = r > 150 && g < 120 ? LOGO_RED
        : r > 170 && g > 170 && b > 170 ? LOGO_WHITE
        : LOGO_NAVY;
      lit.push(i);
    }
    // Rain is held out of a two-cell ring around the mark. Without that gap the
    // silhouette dissolves into the field around it, however bright it is.
    var halo = new Uint8Array(cols * rows);
    var R = 2;
    for (var j = 0; j < lit.length; j++) {
      var cx = lit[j] % cols, cy = (lit[j] / cols) | 0;
      for (var dy = -R; dy <= R; dy++) {
        for (var dx = -R; dx <= R; dx++) {
          var nx = cx + dx, ny = cy + dy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          var ni = ny * cols + nx;
          if (!cells[ni]) halo[ni] = 1;
        }
      }
    }

    logoCells = cells;
    logoLit = lit;
    logoHalo = halo;
  }

  // The wordmark is a standing field of characters, not something the rain has to
  // happen to hit: a slice of its cells is repainted every frame, which outruns the
  // decay and leaves the logo legible and shimmering while rain falls through it.
  function shimmerLogo() {
    if (!logoLit) return;
    var n = Math.max(1, (logoLit.length * 0.08) | 0);
    for (var k = 0; k < n; k++) {
      var i = logoLit[(Math.random() * logoLit.length) | 0];
      drawGlyph(i % cols, (i / cols) | 0, logoCells[i], false);
    }
  }

  // The color an ordinary (non-head) glyph takes at this cell.
  function bodyColor(x, row) {
    var lit = logoCells && row >= 0 && row < rows ? logoCells[row * cols + x] : null;
    return lit || '#1b4488';
  }

  function paint() {
    ctx.fillStyle = '#03060d';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = window.innerWidth;
    var h = window.innerHeight;

    CELL = w < 640 ? 13 : w < 1200 ? 15 : 16;
    cols = Math.ceil(w / CELL);
    rows = Math.ceil(h / CELL);

    canvas.width = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textBaseline = 'top';
    ctx.font = CELL + 'px "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Heiti SC", "Source Han Sans SC", sans-serif';

    // Seed mid-fall so the screen is already raining on the first frame.
    streams = [];
    for (var i = 0; i < cols; i++) {
      for (var n = 0; n < STREAMS_PER_COL; n++) streams.push(seedStream(i, false));
    }

    buildLogoMask();

    paint();
    if (reduceMotion) still();
  }

  function drawGlyph(col, row, color, glow) {
    var x = col * CELL;
    var y = row * CELL;

    ctx.fillStyle = '#03060d';
    ctx.fillRect(x, y, CELL, CELL);

    ctx.shadowBlur = glow ? 14 : 0;
    ctx.shadowColor = glow ? 'rgba(90, 150, 255, 0.9)' : 'transparent';
    ctx.fillStyle = color;
    ctx.fillText(glyph(), x, y);
    ctx.shadowBlur = 0;
  }

  // One motionless frame for viewers who asked not to be moved.
  function still() {
    for (var c = 0; c < streams.length; c++) {
      if (streams[c].gap) continue;
      var x = streams[c].x;
      var head = (Math.random() * rows) | 0;
      var len = 12 + ((Math.random() * 24) | 0);
      for (var t = 0; t < len; t++) {
        var r = head - t;
        if (r < 0) break;
        var fade = 1 - t / len;
        var lit = logoCells ? logoCells[r * cols + x] : null;
        drawGlyph(x, r, t === 0 ? '#eef4ff' : (lit || 'rgba(30, 77, 158, ' + (fade * 0.9).toFixed(3) + ')'), t === 0);
      }
    }
  }

  var lastTime = 0;
  var fadeDebt = 0;

  function frame(time) {
    if (!lastTime) lastTime = time;
    var dt = Math.min((time - lastTime) / 1000, 0.05);
    lastTime = time;

    if (!paused) {
      // Everything already on screen decays toward the void; that decay is the trail.
      // Tied to elapsed time, so trails are the same length at 60Hz and at 120Hz.
      // Held back until it is worth at least 5% alpha: below that, 8-bit rounding
      // leaves the dimmest glyphs on screen forever as a red haze.
      fadeDebt += dt;
      var fade = 1 - Math.pow(0.99, fadeDebt * 60);
      if (fade >= 0.05) {
        ctx.fillStyle = 'rgba(3, 6, 13, ' + fade.toFixed(4) + ')';
        ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);
        fadeDebt = 0;
      }

      shimmerLogo();

      for (var i = 0; i < streams.length; i++) {
        var col = streams[i];
        if (col.gap) continue;

        col.row += col.speed * speedScale * dt;
        var next = Math.floor(col.row);

        while (col.last < next) {
          col.last++;
          if (col.last >= 0 && col.last < rows && !(logoHalo && logoHalo[col.last * cols + col.x])) {
            // Demote the old head to ordinary rain, then light the new one.
            if (col.last - 1 >= 0) drawGlyph(col.x, col.last - 1, bodyColor(col.x, col.last - 1), false);
            var onMark = logoCells && logoCells[col.last * cols + col.x];
            drawGlyph(col.x, col.last, onMark ? '#ffffff' : '#b9d2f5', true);
          }
        }

        // A character mid-stream flips to another — the rain keeps rewriting itself.
        if (Math.random() < 0.06) {
          var back = 1 + ((Math.random() * 10) | 0);
          var r = col.last - back;
          if (r >= 0 && r < rows && !(logoHalo && logoHalo[r * cols + col.x])) {
            var lit = logoCells ? logoCells[r * cols + col.x] : null;
            drawGlyph(col.x, r, lit || 'rgba(195, 34, 63, 0.95)', false);
          }
        }

        if (col.last > rows + 12 + Math.random() * 14) streams[i] = seedStream(col.x, true);
      }
    }

    requestAnimationFrame(frame);
  }

  // HUD fades out of the way once you have read it, and returns when you ask for it.
  var idleTimer;
  function wakeHint() {
    hint.dataset.idle = 'false';
    clearTimeout(idleTimer);
    idleTimer = setTimeout(function () { hint.dataset.idle = 'true'; }, 5000);
  }

  function togglePause() {
    paused = !paused;
    lastTime = 0;
    stateLabel.dataset.visible = paused ? 'true' : 'false';
    wakeHint();
  }

  window.addEventListener('keydown', function (e) {
    if (e.key === ' ' || e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'ArrowUp') { speedScale = Math.min(speedScale * 1.25, 4); wakeHint(); }
    else if (e.key === 'ArrowDown') { speedScale = Math.max(speedScale / 1.25, 0.25); wakeHint(); }
    else if (e.key === 'r' || e.key === 'R') { resize(); wakeHint(); }
  });

  canvas.addEventListener('pointerdown', togglePause);
  window.addEventListener('pointermove', wakeHint, { passive: true });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resize, 150);
  });

  document.addEventListener('visibilitychange', function () { lastTime = 0; });

  resize();
  wakeHint();
  if (!reduceMotion) requestAnimationFrame(frame);
})();
</script>
</body>
</html>
